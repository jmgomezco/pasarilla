  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    :root{
      --header-desktop: 95px;
      --header-mobile: 118px;
    }

    /* Página fija, sin scroll */
    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:'Montserrat', sans-serif;
      background:#122037;
      color:#fff;
    }

    /* Header fijo */
    .container-inicio{
      position:fixed;
      top:0; left:0; right:0;
      z-index:1000;
      background:#122037;
      width:100%;
      padding:20px;
      box-sizing:border-box;
    }

    .contenido{
      max-width:1200px;
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .marca{
      font-size:clamp(16px,4vw,30px);
      font-weight:900;
      color:#ff4500;
      padding:10px 20px;
      line-height:1.3;
      letter-spacing:1.2px;
      text-align:center;
      min-width:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-sizing:border-box;
    }

    .botones-derecha{
      display:flex;
      gap:15px;
      align-items:center;
    }

    .btn-cuadrado{
      display:flex;
      align-items:center;
      justify-content:center;
      width:55px;
      height:55px;
      background-color:#122037;
      border:1px solid #FFFFFF;
      text-decoration:none;
      cursor:pointer;
      transition:transform .2s, box-shadow .2s;
      box-sizing:border-box;
      padding:0;
    }

    .btn-cuadrado:hover{
      transform:translateY(-4px);
      box-shadow:0 4px 8px rgba(0,0,0,.3);
    }

    /* Área principal fija */
    main{
      position:fixed;
      top:var(--header-desktop);
      left:0; right:0; bottom:0;
      overflow:hidden;
    }

    /* Slides/contenedores */
    .slides{
      position:relative;
      width:100%;
      height:100%;
    }

    .slide{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }

    .slide.activo{
      display:flex;
    }

    .slide img{
      max-width:min(92vw, 900px);
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
      object-position:center;
      display:block;
    }

    /* bar.jpg más grande */
    .img-bar-grande{
      max-width:min(98vw, 1200px);
      max-height:96%;
    }

    /* Botones navegación inferior */
    .nav-btn{
      position:absolute;
      bottom:20px;
      z-index:1200;
      width:56px;
      height:56px;
      border:1px solid rgba(255,255,255,.9);
      background:rgba(18,32,55,.65);
      color:#fff;
      font-size:28px;
      line-height:1;
      border-radius:10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      backdrop-filter: blur(2px);
    }

    .nav-btn:hover{
      background:rgba(18,32,55,.9);
    }

    .nav-prev{ left:20px; }
    .nav-next{ right:20px; }

    /* Responsive móvil */
    @media (max-width: 768px){
      .container-inicio{ padding:20px 16px; }

      .contenido{
        max-width:100%;
        gap:25px;
      }

      .marca{
        min-width:0;
        font-size:clamp(24px, 8.5vw, 34px);
        padding:10px 12px;
        letter-spacing:1px;
        line-height:1.15;
      }

      .botones-derecha{ gap:12px; }

      .btn-cuadrado{
        width:62px;
        height:62px;
      }

      main{
        top:var(--header-mobile);
      }

      .slide{
        padding:16px;
      }

      .slide img{
        max-width:100%;
        max-height:100%;
      }

      /* mantener bar.jpg más grande también en móvil */
      .img-bar-grande{
        max-width:100%;
        max-height:98%;
      }

      .nav-btn{
        width:52px;
        height:52px;
        bottom:14px;
        font-size:24px;
      }

      .nav-prev{ left:14px; }
      .nav-next{ right:14px; }
    }
  </style>
</head>

      <!-- Contenedor 3 -->

      <!-- Contenedor 4 -->

    </div>

    <!-- Navegación -->
    <button class="nav-btn nav-prev" id="btnPrev" aria-label="Anterior">‹</button>
    <button class="nav-btn nav-next" id="btnNext" aria-label="Siguiente">›</button>
  </main>

  <script>
    (function () {
      const slides = Array.from(document.querySelectorAll('.slide'));
      const prev = document.getElementById('btnPrev');
      const next = document.getElementById('btnNext');
      let index = 0;

      function showSlide(i){
        slides.forEach((s, idx) => s.classList.toggle('activo', idx === i));
      }

      prev.addEventListener('click', () => {
        index = (index - 1 + slides.length) % slides.length;
        showSlide(index);
      });

      next.addEventListener('click', () => {
        index = (index + 1) % slides.length;
        showSlide(index);
      });
    })();
  </script>
