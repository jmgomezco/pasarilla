<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pasarilla.com</title>
  <style>
    :root{
      --header-height: 86px;
      --header-bg: #1f1f1f;   /* cambia si tu color actual es otro */
      --content-bg: #f5f5f5;
      --text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: var(--content-bg);
    }

    .header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: var(--header-height);
      background: var(--header-bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      z-index: 1000;
    }

    .brand {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .sobre-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      color: #fff;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .sobre-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .content {
      margin-top: var(--header-height);
      background: var(--content-bg);
      min-height: calc(100vh - var(--header-height));
      padding: 20px;
    }

    .photo-wrap {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
    }

    .photo-wrap img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 8px;
      background: #eee;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1 class="brand">pasarilla.com</h1>

    <button class="sobre-btn" type="button" aria-label="Sobre">
      <!-- Icono SVG de sobre -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M4 7l8 6 8-6"></path>
      </svg>
      <span>Sobre</span>
    </button>
  </header>

  <main class="content">
    <div class="photo-wrap">
      <img src="assets/images/bar.jpg" alt="Foto bar" />
    </div>
  </main>
</body>
</html>
