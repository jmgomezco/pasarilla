<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pasarilla.com</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet" />

    <style>
        :root{
            --header-desktop: 95px;
            --header-mobile: 118px;
        }

        /* Global */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #122037;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow: hidden; /* toda la página sin scroll */
        }

        /* Header fijo */
        .container-inicio {
            background-color: #122037;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .contenido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .marca {
            font-size: clamp(16px, 4vw, 30px);
            font-weight: 900;
            color: #ff4500;
            padding: 10px 20px;
            line-height: 1.3;
            letter-spacing: 1.2px;
            text-align: center;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .botones-derecha {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-cuadrado {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background-color: #122037;
            border: 1px solid #FFFFFF;
            text-decoration: none;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            box-sizing: border-box;
            padding: 0;
        }

        .btn-cuadrado:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 8px rgba(0,0,0,.3);
        }

        /* Área fija sin scroll */
        main {
            position: fixed;
            top: var(--header-desktop);
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #f5f5f5;
            overflow: hidden;
        }

        .galeria {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .galeria img {
            display: block;
            max-width: min(92vw, 900px);
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container-inicio { padding: 20px 16px; }

            .contenido {
                max-width: 100%;
                gap: 25px;
            }

            .marca {
                min-width: 0;
                font-size: clamp(24px, 8.5vw, 34px);
                padding: 10px 12px;
                letter-spacing: 1px;
                line-height: 1.15;
            }

            .botones-derecha { gap: 12px; }

            .btn-cuadrado {
                width: 62px;
                height: 62px;
            }

            main {
                top: var(--header-mobile);
            }

            .galeria {
                padding: 16px;
            }

            .galeria img {
                max-width: 100%;
                max-height: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="container-inicio">
        <div class="contenido">
            <div class="marca">pasarilla.com</div>
            <div class="botones-derecha">
                <a href="mailto:jmgomezco@gmail.com" class="btn-cuadrado" aria-label="Enviar correo a soporte">
                    <svg viewBox="0 0 24 24" style="width:70%; height:70%;" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="5" width="20" height="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="2" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="22" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="galeria">
            <img src="./assets/images/boda.jpg" alt="Pasarilla" />
        </div>
    </main>

</body>
</html>
