<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <title>pasarilla.com</title>
    <!-- Importación de fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #122037;
            font-family: 'Montserrat', sans-serif;
            color: #FFFFFF;
        }

        /* Contenedor Inicio */
        .container-inicio {
            background-color: #122037;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .contenido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Componente Marca */
        .marca {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(16px, 4vw, 30px);
            font-weight: 900;
            color: #ff4500;
            padding: 10px 20px;
            line-height: 1.3;
            letter-spacing: 1.2px;
            text-align: center;
            width: fit-content;
            min-width: 120px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Agrupación de botones */
        .botones-derecha {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Estilo base para botones cuadrados */
        .btn-cuadrado {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background-color: #122037;
            border: 1px solid #FFFFFF;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            padding: 0;
        }

        .btn-cuadrado:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        <style>
/* ...tu CSS actual... */

/* Responsive */
@media (max-width: 768px) {
    .container-inicio { padding: 12px 10px; }

    .contenido {
        max-width: 100%;
        gap: 10px;
    }

    .marca {
        min-width: 0;
        font-size: clamp(14px, 5.5vw, 20px);
        padding: 4px 6px;
        letter-spacing: 0.6px;
        line-height: 1.1;
    }

    .botones-derecha { gap: 8px; }

    .btn-cuadrado {
        width: 44px;
        height: 44px;
    }

    /* Compensa cabecera fija en móvil */
    main {
        padding-top: 76px !important;
    }

    /* Fotos más pequeñas y adaptables en móvil */
    main img {
        height: auto !important;
        width: min(92vw, 520px) !important;
        max-width: 100% !important;
    }
}

/* Extra pequeño */
@media (max-width: 420px) {
    .container-inicio { padding: 10px 8px; }

    .marca {
        font-size: clamp(12px, 5.8vw, 17px);
        padding: 2px 4px;
    }

    .btn-cuadrado {
        width: 40px;
        height: 40px;
    }

    main {
        padding-top: 70px !important;
    }

    main img {
        width: 94vw !important;
    }
}
</style>
        

  
</head>
<body style="overflow: hidden;">

    <!-- Cabecera fija arriba -->
    <header class="container-inicio" style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000;">
        <div class="contenido">
            <!-- Marca -->
            <div class="marca">pasarilla.com</div>

            <!-- Botones Derecha -->
            <div class="botones-derecha">
                <!-- BotonSobre -->
                <a href="mailto:jmgomezco@gmail.com" class="btn-cuadrado" aria-label="Enviar correo a soporte">
                    <svg viewBox="0 0 24 24" style="width:70%; height:70%;" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="5" width="20" height="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="2" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="22" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    
    <!-- Contenedor inferior con scroll -->

<main style="height: 100vh; padding-top: 95px; background-color: #f5f5f5; overflow-y: auto; box-sizing: border-box;">
  <div style="min-height: calc(100vh - 95px); display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; padding: 24px;">
    <img src="./assets/images/bar.jpg"
         alt="Bar"
         style="display:block; height:70vh; max-height:720px; width:auto;">

    <img src="./assets/images/pasarilla_eras-1920w-7.jpeg"
         alt="Pasarilla"
         style="display:block; height:70vh; max-height:720px; width:auto;">
  </div>
</main>

    
</body>
</html>
