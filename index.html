<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de la asociación de amigos de Pasarilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-height: clamp(76px, 12vh, 112px);
            --header-background: #122037;
            --feed-background: #f5f5f5;
            --surface-color: #FFFFFF;
            --text-on-dark: #FFFFFF;
            --text-on-light: #24344e;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--feed-background);
        }

        body {
            color: var(--text-on-light);
        }

        .site-header {
            position: fixed;
            inset: 0 0 auto 0;
            height: var(--header-height);
            width: 100%;
            background-color: var(--header-background);
            color: var(--text-on-dark);
            z-index: 10;
            box-shadow: 0 14px 36px rgba(8, 18, 33, 0.28);
        }

        .header-content {
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            padding: 0 clamp(18px, 4vw, 40px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .marca {
            margin: 0;
            font-size: clamp(1.25rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }

        .about-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-on-dark);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .about-button:hover,
        .about-button:focus-visible {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.38);
            transform: translateY(-1px);
        }

        .feed {
            position: fixed;
            top: var(--header-height);
            right: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            background-color: var(--feed-background);
            padding: clamp(16px, 3vw, 32px);
        }

        .photo-list {
            width: min(100%, 920px);
            margin: 0 auto;
            display: grid;
            gap: clamp(16px, 2vw, 24px);
        }

        .photo-card {
            margin: 0;
            padding: clamp(10px, 2vw, 16px);
            border-radius: 20px;
            background: var(--surface-color);
            box-shadow: 0 18px 40px rgba(18, 32, 55, 0.1);
        }

        .photo-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: min(48vw, 320px);
            border-radius: 14px;
            overflow: hidden;
            background: #e8ebf0;
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 72vh;
            object-fit: contain;
            background: #e8ebf0;
        }

        .missing-image {
            width: 100%;
            padding: 36px 24px;
            text-align: center;
            color: #5f6f86;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .photo-caption {
            margin: 14px 4px 2px;
            color: #405065;
            font-size: 0.95rem;
        }

        .feed-loader {
            width: min(100%, 920px);
            margin: 20px auto 8px;
            padding: 16px;
            text-align: center;
            color: #6b7787;
            font-size: 0.92rem;
        }

        @media (max-width: 768px) {
            .header-content {
                padding-inline: 16px;
            }

            .marca {
                letter-spacing: 0.04em;
            }

            .about-button {
                padding-inline: 16px;
            }

            .feed {
                padding: 14px;
            }

            .photo-card {
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <h1 class="marca">pasarilla.com</h1>
            <a href="mailto:jmgomezco@gmail.com" class="about-button" aria-label="Sobre - Enviar correo">Sobre</a>
        </div>
    </header>

    <main id="feed" class="feed">
        <section id="photoList" class="photo-list" aria-live="polite"></section>
        <div id="feedLoader" class="feed-loader">Desplázate para seguir cargando fotos.</div>
    </main>

    <script>
        // Coloca la imagen principal en /assets/images/bar.jpg
        // Añade nuevas rutas al array para ampliar el feed automáticamente.
        const imageFeed = [
            { src: 'assets/images/bar.jpg', alt: 'Fotografía del bar de Pasarilla' }
        ];
        const UI_TEXT = {
            emptyFeed: 'Añade imágenes al array imageFeed para activar el feed.',
            repeatFeed: 'El feed sigue cargando reutilizando las imágenes disponibles. Añade más rutas a imageFeed para evitar repeticiones.',
            missingImagePrefix: 'Añade la imagen en ',
            missingImageSuffix: ' para mostrarla en el feed y recarga la página para verla.'
        };
        const INITIAL_PHOTO_COUNT = 3;
        const PHOTOS_PER_LOAD = 2;
        const SCROLL_LOAD_MARGIN = '250px 0px';

        const photoList = document.getElementById('photoList');
        const feed = document.getElementById('feed');
        const feedLoader = document.getElementById('feedLoader');
        let nextImageIndex = 0;
        let hasShownRepeatNotice = false;

        function createPhotoCard(image) {
            const article = document.createElement('article');
            article.className = 'photo-card';

            const frame = document.createElement('div');
            frame.className = 'photo-frame';

            const img = document.createElement('img');
            img.src = image.src;
            img.alt = image.alt;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.addEventListener('error', () => {
                img.hidden = true;
                frame.appendChild(createMissingImageNotice(image.src));
            }, { once: true });

            const caption = document.createElement('p');
            caption.className = 'photo-caption';
            caption.textContent = image.alt;

            frame.appendChild(img);
            article.append(frame, caption);
            return article;
        }

        function createMissingImageNotice(path) {
            const notice = document.createElement('div');
            notice.className = 'missing-image';
            notice.appendChild(document.createTextNode(UI_TEXT.missingImagePrefix));

            const strong = document.createElement('strong');
            strong.textContent = path;

            notice.appendChild(strong);
            notice.appendChild(document.createTextNode(UI_TEXT.missingImageSuffix));
            return notice;
        }

        function getNextImage() {
            const image = imageFeed[nextImageIndex % imageFeed.length];
            nextImageIndex += 1;
            return image;
        }

        function appendPhotos(batchSize) {
            if (imageFeed.length === 0) {
                feedLoader.textContent = UI_TEXT.emptyFeed;
                return;
            }

            for (let count = 0; count < batchSize; count += 1) {
                photoList.appendChild(createPhotoCard(getNextImage()));

                if (!hasShownRepeatNotice && nextImageIndex > imageFeed.length) {
                    feedLoader.textContent = UI_TEXT.repeatFeed;
                    hasShownRepeatNotice = true;
                }
            }
        }

        appendPhotos(INITIAL_PHOTO_COUNT);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    appendPhotos(PHOTOS_PER_LOAD);
                }
            });
        }, {
            root: feed,
            rootMargin: SCROLL_LOAD_MARGIN,
            threshold: 0
        });

        if (imageFeed.length > 0) {
            observer.observe(feedLoader);
        }
    </script>
</body>
</html>
