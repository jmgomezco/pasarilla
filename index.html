<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>pasarilla.com</title>
    <!-- Importación de fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #122037;
            font-family: 'Montserrat', sans-serif;
            color: #FFFFFF;
        }

        /* Contenedor Inicio */
        .container-inicio {
            background-color: #122037;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .contenido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Componente Marca */
        .marca {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(16px, 4vw, 30px);
            font-weight: 900;
            color: #ff4500;
            padding: 10px 20px;
            line-height: 1.3;
            letter-spacing: 1.2px;
            text-align: center;
            width: fit-content;
            min-width: 120px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Agrupación de botones */
        .botones-derecha {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Estilo base para botones cuadrados */
        .btn-cuadrado {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background-color: #122037;
            border: 1px solid #FFFFFF;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            padding: 0;
        }

        .btn-cuadrado:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive XL móvil */
        @media (max-width: 768px) {
            .container-inicio { padding: 20px 16px !important; }

            .contenido {
                max-width: 100% !important;
                gap: 14px !important;
            }

            .marca {
                min-width: 0 !important;
                font-size: clamp(24px, 8.5vw, 34px) !important;
                padding: 10px 12px !important;
                letter-spacing: 1px !important;
                line-height: 1.15 !important;
            }

            .botones-derecha { gap: 12px !important; }

            .btn-cuadrado {
                width: 62px !important;
                height: 62px !important;
            }

            main { padding-top: 118px !important; }

            main img {
                height: auto !important;
                width: min(94vw, 560px) !important;
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body style="overflow: hidden;">

    <!-- Cabecera fija arriba -->
    <header class="container-inicio" style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000;">
        <div class="contenido">
            <div class="marca">pasarilla.com</div>

            <div class="botones-derecha">
                <a href="mailto:jmgomezco@gmail.com" class="btn-cuadrado" aria-label="Enviar correo a soporte">
                    <svg viewBox="0 0 24 24" style="width:70%; height:70%;" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="5" width="20" height="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="2" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="22" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenedor inferior con scroll -->

    <main style="height: 100vh; padding-top: 95px; background-color: #f5f5f5; overflow-y: auto; box-sizing: border-box;">
    <div style="min-height: calc(100vh - 95px); display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; padding: 24px;">
        <img src="./assets/images/bar.jpg"
             alt="Bar"
             style="display:block; height:70vh; max-height:720px; width:auto;">

        <img src="./assets/images/pasarilla_eras-1920w-7.jpeg"
             alt="Pasarilla"
             style="display:block; height:70vh; max-height:720px; width:auto;">
    </div>
</main>
