<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <title>Pagina de la asociación de amigos de pasarilla</title>
    <!-- Importación de fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #122037;
            font-family: sans-serif;
            color: #FFFFFF;
        }

        /* Contenedor Inicio */
        .container-inicio {
            background-color: #122037;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .contenido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Componente Marca */
        .marca {
            font-family: 'Audiowide', sans-serif;
            font-size: clamp(16px, 4vw, 30px);
            font-weight: 900;
            color: #FFFFFF;
            padding: 10px 20px;
            line-height: 1.3;
            letter-spacing: 1.2px;
            text-align: center;
            width: fit-content;
            min-width: 120px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Agrupación de botones */
        .botones-derecha {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Estilo base para botones cuadrados */
        .btn-cuadrado {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background-color: #122037;
            border: 1px solid #FFFFFF;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            padding: 0;
        }

        .btn-cuadrado:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Botón CIE (Texto Verdana) */
        .boton-cie {
            color: #FFFFFF;
            font-family: 'Verdana', sans-serif;
            font-size: 15px;
            font-weight: bold;
        }

       

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container-inicio { padding: 15px; }
            .marca { min-width: 80px; font-size: clamp(12px, 7vw, 22px); padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div class="container-inicio">
        <div class="contenido">
            <!-- Marca -->
            <div class="marca">pasarilla.com</div>

            <!-- Botones Derecha -->
            <div class="botones-derecha">
                <!-- BotonSobre -->
                <a href="mailto:jmgomezco@gmail.com" class="btn-cuadrado" aria-label="Enviar correo a soporte">
                    <svg viewBox="0 0 24 24" style="width:70%; height:70%;" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="5" width="20" height="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="2" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                        <line x1="22" y1="5" x2="12" y2="13" stroke="#FFFFFF" stroke-width="3"/>
                    </svg>
                </a>

                <!-- BotonCie -->
                <button id="openPopupBtn" class="btn-cuadrado boton-cie" aria-label="Abrir CIE-10">
                    LOGIN
                </button>
            </div>
        </div>
    </div>
    
</body>
</html>
